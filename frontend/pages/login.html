<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Kanya House of Sarees</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">


<div class="logo-section">

<img src="../assets/images/logo.png" 
class="logo" 
alt="Kanya Logo">

<h2>Kanya House of Sarees</h2>

</div>



<nav class="nav-icons">


<a href="index.html" class="nav-item">

<img src="../assets/images/home-button.png" alt="Home">

<span>Home</span>

</a>


</nav>


</header>





<!-- ================= LOGIN ================= -->


<section class="form-page">


<div class="form-container">


<h1>Welcome Back</h1>


<p>
Login to continue shopping with Kanya House of Sarees.
</p>




<form id="loginForm">

    <label for="loginEmail">
        Email Address
    </label>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required>

    <label for="loginPassword">
        Password
    </label>

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required>

    <button
        type="submit"
        class="login-btn">
        Login
    </button>

</form>






<p class="signup-text">

Don't have an account?

<a href="signup.html">
Sign Up
</a>

</p>





<a href="forgot-password.html" class="forgot-password">

Forgot Password?

</a>



</div>


</section>

</div>

</body>

</html>
