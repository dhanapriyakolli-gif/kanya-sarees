</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">


<div class="logo-section">

<img src="../assets/images/logo.png"
class="logo"
alt="Kanya Logo">

<h2>Kanya House of Sarees</h2>

</div>



<nav class="nav-icons">


<a href="index.html" class="nav-item">

<img src="../assets/images/home-button.png" alt="home">

<span>Home</span>

</a>

<img src="../assets/images/product.png" alt="product">

<span>Products</span>

</a>




<a href="category.html" class="nav-item">

<img src="../assets/images/categories.png" alt="categories">

<span>Categories</span>

</a>



<a href="cart.html" class="nav-item">

    <div class="icon-box">

        <img src="../assets/images/shopping-cart.png" alt="Cart">

        <span id="cartCount">0</span>

    </div>

    <span>Cart</span>

<a href="wishlist.html" class="nav-item">

</header>




<!-- ================= PROFILE SECTION ================= -->


<section class="profile-page">


<div class="profile-card">



<img src="../assets/images/user-avatar.png"
class="profile-image"
alt="Profile">



<h1>My Profile</h1>




<div class="profile-form">


<label>
Full Name
</label>


<input 
type="text"
id="profileName"
placeholder="Enter your name">





<label>
Email
</label>


<input 
type="email"
id="profileEmail"
placeholder="Enter your email"
readonly>





<label>
Mobile Number
</label>


<input
type="tel"
id="profilePhone"
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
placeholder="Enter 10-digit mobile number">




<label>
Address
</label>


<textarea
id="profileAddress"
rows="4"
placeholder="Enter address"></textarea>





<label>
City
</label>


<input
type="text"
id="profileCity"
placeholder="Enter city">





<label>
Pincode
</label>


<input
type="text"
id="profilePincode"
maxlength="6"
pattern="[0-9]{6}"
inputmode="numeric"
placeholder="Enter 6-digit pincode">



</div>





<!-- BUTTONS -->


<div class="profile-buttons">

    <button
        id="saveProfileBtn"
        class="profile-btn">
        Save Profile
    </button>

    <a
        href="orders.html"
        class="profile-btn">
        My Orders
    </a>

    <button
        id="logoutBtn"
        class="logout-btn">
        Logout
    </button>

</div>

</section>
