class="logo" 
alt="Kanya Logo">

</div>



<nav class="nav-icons">

</a>

<!-- ================= SIGNUP ================= -->


<section class="form-page">


<div class="form-container">


<h1>Create Account</h1>


<p>
Join Kanya House of Sarees and explore our elegant collections.
</p>



<form id="signupForm">

    <label for="signupName">
        Full Name
    </label>

    <input
        type="text"
        id="signupName"
        placeholder="Enter your name"
        required>

    <label for="signupPhone">
        Phone Number
    </label>

    <input
        type="tel"
        id="signupPhone"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
        pattern="[0-9]{10}"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        required>

    <label for="signupEmail">
        Email Address
    </label>

    <input
        type="email"
        id="signupEmail"
        placeholder="Enter your email"
        required>

    <label for="signupPassword">
        Password
    </label>

    <input
        type="password"
        id="signupPassword"
        placeholder="Create password"
        required>

    <label for="confirmPassword">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
        required>

    <button
        type="submit"
        class="signup-btn">
        Sign Up
    </button>

</form>




<p class="login-text">


Already have an account?


<a href="login.html">

Login

</a>


</p>



</div>


</section>
